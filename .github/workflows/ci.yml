name: CI

# Green-checkmark gate on every push/PR to main or beta: run the unit tests and
# verify that BOTH the 32-bit and 64-bit executable and Inno Setup installer
# build via the project's own build_exe.py / setup.iss. Releases run separately
# via release.yml on version tags.

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v

  build:
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (${{ matrix.arch }})
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}

      - name: Build executable (${{ matrix.arch }})
        run: python build_exe.py --arch ${{ matrix.arch }}

      - name: Verify executable was produced
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION -Raw).Trim()
          $exe = "dist/ScanLink_${ver}_${{ matrix.arch }}.exe"
          if (!(Test-Path $exe)) { throw "$exe was not produced" }
          Get-Item $exe | Format-List Name, Length

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer (${{ matrix.arch }})
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppArch=${{ matrix.arch }} setup.iss
          $ver = (Get-Content VERSION -Raw).Trim()
          if (!(Test-Path "ScanLinkSetup_${ver}_${{ matrix.arch }}.exe")) { throw "installer was not produced" }

      - name: Smoke test installed app (${{ matrix.arch }})
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION -Raw).Trim()
          & ./tests/windows_install_smoke.ps1 `
            -ExpectedArch "${{ matrix.arch }}" `
            -InstallerPath "ScanLinkSetup_${ver}_${{ matrix.arch }}.exe"
